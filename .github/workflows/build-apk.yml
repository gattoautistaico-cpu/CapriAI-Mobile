name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Keystore dai Secrets (stessa firma = aggiornamenti installabili)
        env:
          KS: ${{ secrets.RELEASE_JKS_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > tc/release.jks; echo "keystore dai secrets"; else echo "ATTENZIONE: nessun secret, verrà generata una chiave nuova"; fi

      - name: Build
        run: |
          chmod +x build-apk.sh tc/*.sh
          VN="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/* ]] || VN="0.3.${GITHUB_RUN_NUMBER}"
          ./build-apk.sh "$GITHUB_RUN_NUMBER" "$VN"

      - uses: actions/upload-artifact@v4
        with:
          name: CapriAI-apk
          path: app/*.apk

      - name: Release (solo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/*.apk
