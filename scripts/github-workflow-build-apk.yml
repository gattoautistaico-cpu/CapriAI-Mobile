name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Keystore dai Secrets (stessa firma = aggiornamenti installabili)
        env:
          KS: ${{ secrets.RELEASE_JKS_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > tc/release.jks; echo "keystore dai secrets"; else echo "ATTENZIONE: nessun secret, verrà generata una chiave nuova"; fi

      - name: Build
        run: |
          chmod +x build-apk.sh tc/*.sh
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VN="${GITHUB_REF_NAME#v}"
            IFS=. read -r MA MI PA <<< "$VN"
            VC=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          else
            VN="dev.${GITHUB_RUN_NUMBER}"; VC=1
          fi
          ./build-apk.sh "$VC" "$VN"

      - uses: actions/upload-artifact@v4
        with:
          name: CapriAI-apk
          path: app/*.apk

      # La release con l'APK firmato con la chiave ufficiale si pubblica dal PC (release-*.bat):
      # qui l'APK resta solo negli artifact, così non compare una seconda firma incompatibile.
